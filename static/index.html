<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;overflow:hidden}

.abs{position:absolute}

.learn{left:1329px;top:30px;font:500 28px/36px 'Cormorant Garamond',serif;color:#000;text-decoration:none;white-space:nowrap}
.learn:hover{color:#c8000a}
.pill{left:100px;top:174px;width:886px;height:64px;border-radius:32px;border:3px solid transparent;background-image:linear-gradient(#fff,#fff),linear-gradient(90deg,#bfe3f5 0%,#e53935 45%,#2f9e44 100%);background-origin:border-box;background-clip:padding-box,border-box;transition:box-shadow .3s}
.pill:focus-within{box-shadow:0 8px 30px rgba(229,57,53,.3)}

.pill button:hover{background:#c8000a;transform:scale(1.1)}
.arrow path{fill:none;stroke:#000;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .4s ease-out forwards}

.agent{all:unset;z-index:2;position:absolute;cursor:pointer;width:396px;height:396px;border-radius:50%;display:block}
.agent .r{position:absolute;inset:0;border-radius:50%;padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .3s}

.agent:hover img{transform:scale(1.05)}
.agent[aria-pressed=true]{box-shadow:0 0 50px rgba(168,85,247,.35)}
.agent[aria-pressed=true] .r{filter:saturate(1.4)}
.agent:focus-visible{outline:3px solid #000;outline-offset:6px}

.robot{left:1128px;top:98px;height:622px;transform-origin:50% 90%;animation:bob 4.5s ease-in-out infinite,glow 3.6s ease-in-out infinite}

.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:600 28px 'Josefin Sans',sans-serif;letter-spacing:.08em;color:#ffc000;text-transform:uppercase}

td{padding:6px 10px;border-bottom:1px solid #222}

.dl{display:grid;grid-template-columns:1fr 1fr;gap:26px 44px;margin:26px 10px 0}
.dlb{border:0;cursor:pointer;background:#ffc000;color:#000;font:700 36px 'Cormorant Garamond',serif;letter-spacing:.06em;padding:18px;border-radius:14px;transition:.25s}
.dlb:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(255,192,0,.4)}
.dlb:nth-child(3){grid-column:1/3;justify-self:center;width:calc(50% - 22px)}
.dots i{font-style:normal;animation:dt 1s infinite}.dots i:nth-child(3){animation-delay:.2s}.dots i:nth-child(4){animation-delay:.4s}

.hlogo{position:absolute;left:16px;top:calc(34% - 18px);width:36px;height:36px;background:#fff;border-radius:4px;display:grid;place-items:center;z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.hlogo svg{width:22px;height:22px;fill:none;stroke:#14141c;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hcard{position:absolute;left:7px;right:7px;bottom:7px;top:34%;border-radius:14px;background:#14141c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);padding:26px 12px 10px 14px;display:flex;flex-direction:column;min-height:0}
.ht{font:700 19px/1.1 'Josefin Sans',sans-serif;color:#fff}
.hc{margin-top:3px;font:600 12px 'Josefin Sans',sans-serif;color:#9aa0b8}
.hc b{font:700 20px 'Josefin Sans',sans-serif;color:#ffb020;margin-right:2px}.hc i{font-style:normal}
.hd2{display:flex;gap:6px;margin:8px 0 6px}
.hd2 input{flex:1;min-width:0;border:1px solid #34344a;border-radius:8px;padding:5px 8px;font:600 12px 'Josefin Sans',sans-serif;background:#23232f;color:#fff;color-scheme:dark}
.hd2 button{border:0;border-radius:8px;padding:5px 12px;background:#ffb020;color:#14141c;font:700 12px 'Josefin Sans',sans-serif;cursor:pointer}
#hlist{list-style:none;margin:0;padding:0 5px 0 0;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#ffb020 transparent}
#hlist::-webkit-scrollbar{width:6px}#hlist::-webkit-scrollbar-thumb{background:#ffb020;border-radius:6px}
#hlist li{display:flex;align-items:center;gap:8px;height:var(--rh,40px);flex:none;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;color:#f3f3ff;font:400 13px 'Josefin Sans',sans-serif;transition:background .2s}
#hlist li:hover{background:rgba(255,176,32,.13)}
#hlist li.he{cursor:default;color:#9aa0b8;white-space:normal}#hlist li.he:hover{background:none}
.hq{flex:1;min-width:0;white-space:nowrap;overflow-x:auto;overflow-y:hidden;padding:2px 0 7px;scrollbar-width:thin;scrollbar-color:#ffb020 transparent}
.hq::-webkit-scrollbar{height:4px}.hq::-webkit-scrollbar-thumb{background:#ffb020;border-radius:4px}
.hs{width:8px;height:8px;border-radius:50%;flex:none}
.hm{font-size:11px;color:#9aa0b8;flex:none}
.hs.sql{background:#22d3ee}.hs.etl{background:#ff4d8d}.hs.blocked{background:#ef4444}.hs.error{background:#f59e0b}
#etl,#sql,#panel,.mintbg,.guy,.mtxt,#b,.tb3{translate:calc(var(--dx,0px)*var(--kc,.45) + var(--sx,0px)) 0}
.tb2{translate:calc(var(--dx,0px)*((1 + var(--kc,.45))/2) + var(--sx,0px)*.5) 0}
#etl,#sql{transition:left .9s cubic-bezier(.3,1.2,.4,1),top .9s cubic-bezier(.3,1.2,.4,1),transform .9s cubic-bezier(.3,1.2,.4,1),translate .9s ease}
.mk{background:none;padding:0}

.hcard{top:38%}

.zap{animation:zapidle 4.5s steps(1) infinite}
@keyframes zapidle{0%,86%,100%{opacity:0}88%,92%{opacity:1}90%{opacity:.35}}
#stage.think .zap{animation:none;opacity:1}
.zap path{stroke-width:3;stroke-dasharray:16 9}
.zap path:nth-child(4){animation-delay:.1s}.zap path:nth-child(5){animation-delay:.25s;stroke:#ffc0da;filter:drop-shadow(0 0 4px #ff2d78) drop-shadow(0 0 9px #ff2d78)}
#panel{translate:calc(var(--dx,0px)*var(--kc,.45) + var(--sx,0px) + var(--px,0px)) 0}
.empty .hint{opacity:.8;font-weight:400}
#stage.ready{transition:transform .5s ease,left .5s ease,top .5s ease}


/* cans: a light that runs along their real outline, natural fizz, hand-drawn ribbons and doodles */
.cans .edge{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cans .eb{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.1;stroke-linejoin:round}
.cans .er{fill:none;stroke:url(#eg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:150 850;filter:drop-shadow(0 0 3px #ff2d78) drop-shadow(0 0 7px #22d3ee);animation:run 3.6s linear infinite}
.cans .er.r2{stroke:url(#eg2);stroke-width:2.4;stroke-dasharray:90 910;animation:run 5.2s linear infinite reverse;opacity:.9}
.cans .er.c2{animation-delay:-1.8s}
@keyframes run{to{stroke-dashoffset:-1000}}
.cans .bb{position:absolute;bottom:6%;width:6px;height:6px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(120,220,255,.12));opacity:0;animation:rise 4s linear infinite}
.cans .b1{left:10%;animation-delay:-.2s}.cans .b2{left:22%;width:4px;height:4px;animation-delay:-1.7s;animation-duration:3.4s}
.cans .b3{left:34%;animation-delay:-2.9s;animation-duration:4.6s}.cans .b4{left:46%;width:4px;height:4px;animation-delay:-.9s;animation-duration:3.2s}
.cans .b5{left:58%;width:7px;height:7px;animation-delay:-3.4s;animation-duration:4.8s}.cans .b6{left:70%;width:4px;height:4px;animation-delay:-2.1s;animation-duration:3.6s}
.cans .b7{left:82%;animation-delay:-1.1s;animation-duration:4.2s}.cans .b8{left:92%;width:4px;height:4px;animation-delay:-3.1s;animation-duration:3.8s}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}12%{opacity:.95}35%{transform:translate(3px,-34px) scale(.9)}65%{transform:translate(-3px,-72px) scale(1)}100%{transform:translate(2px,-108px) scale(.8);opacity:0}}
.ans .fx{position:absolute;left:11px;top:11px;width:524px;height:112px;overflow:hidden;pointer-events:none;z-index:1}
.fx .rb{fill:none;stroke-linecap:round;stroke-width:2.4;stroke-dasharray:100 100;stroke-dashoffset:100;opacity:0;animation:rdraw 6s ease-in-out infinite}
.fx .rb.s{stroke-width:1.4;animation-duration:7.5s}
@keyframes rdraw{0%{stroke-dashoffset:100;opacity:0}12%{opacity:1}55%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:-100;opacity:0}100%{stroke-dashoffset:-100;opacity:0}}
.fx .dd{transform-box:fill-box;transform-origin:center;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:dfloat 6s ease-in-out infinite alternate}
.fx .y{stroke:#ffc000}.fx .c{stroke:#22d3ee}.fx .p{stroke:#a78bfa}.fx .o{stroke:#ff8a00}.fx .k{stroke:#ff4d8d}
@keyframes dfloat{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-9px) rotate(40deg)}}
/* busier while the agent works, a splash of fizz when the answer arrives */
#stage.think .cans{animation:glowp 1.4s ease-in-out infinite}
#stage.think .cans .er{animation-duration:1.5s}#stage.think .cans .er.r2{animation-duration:2.2s}
#stage.think .cans .bb{animation-duration:2s}#stage.think .fx .rb{animation-duration:3.4s}
.cans.burst .bb{animation-duration:1.3s}.cans.burst .er{animation-duration:1.1s}
</style>
</head>

<script>
const st=document.getElementById('stage');let DX=0,HR=0;
function fit(){const need=st.classList.contains('res')?240:0,s=Math.min(innerHeight/900,innerWidth/(1600+need));
  const dx=Math.min(Math.max(innerWidth/s-1600,0),600);
  st.style.width=(1600+dx)+'px';st.style.setProperty('--dx',dx+'px');
  st.style.transform='scale('+s+')';st.style.left=(innerWidth-(1600+dx)*s)/2+'px';st.style.top=(innerHeight-900*s)/2+'px';
  const f=Math.min(1.15,1+dx/1200),tg=document.getElementById('tagt');
  if(tg){tg.removeAttribute('transform');tg.setAttribute('x',512);tg.setAttribute('y',98+(f-1)*20);tg.setAttribute('textLength',672*f);tg.setAttribute('font-size',72*f)}
  DX=dx;placeHist();placeDesc()}
function placeHist(){
  const h=document.getElementById('hist');if(!h)return;const res=st.classList.contains('res');
  const on=res&&DX>=239;HR=0;
  st.style.setProperty('--sx',on?'205px':'0px');st.style.setProperty('--px',on?'48px':'0px');st.style.setProperty('--kc',on?'.1':'.45');
  if(on){h.style.left='194px';h.style.top='325px';h.style.width='244px';h.style.height=((st.dataset.m==='etl'?860:875)-325)+'px';h.classList.add('on');
    const l=document.getElementById('hlist');l.style.setProperty('--rh',Math.max(30,Math.floor(l.clientHeight/5))+'px')}
  else h.classList.remove('on')}
function placeDesc(){const d=document.querySelector('.desc');if(!d)return;
  d.classList.remove('gap');
  if(st.classList.contains('res')){d.style.opacity=0;return}
  const c=543.5+.45*DX;
  d.style.width='640px';d.style.fontSize='26px';d.style.left=(c-320)+'px';d.style.top='716px';d.style.opacity=1}
const hlist=document.getElementById('hlist'),hdate=document.getElementById('hd');
function fmtT(ts){const n=new Date(),td=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');return ts.slice(0,10)===td?ts.slice(11,16):ts.slice(8,10)+'/'+ts.slice(5,7)}
async function loadHist(){
  const d=hdate.value;
  try{const r=await fetch(API_BASE+'/api/history?date='+encodeURIComponent(d));if(!r.ok)throw 0;const j=await r.json();
    document.getElementById('hn').textContent=j.count;
    document.getElementById('hl').textContent=d?'queries on '+new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'queries today';
    hlist.innerHTML=j.items.length?j.items.map(it=>'<li data-q="'+esc(it.question)+'" title="'+esc(it.question)+'"><i class="hs '+(it.status==='ok'?it.route:it.status)+'"></i><span class="hq">'+esc(it.question)+'</span><span class="hm">'+fmtT(it.ts)+'</span></li>').join(''):'<li class="he">'+(d?'No queries on this day':'No queries yet')+'</li>'}
  catch(e){hlist.innerHTML='<li class="he">History appears when the backend is running</li>'}}
hlist.addEventListener('click',e=>{const li=e.target.closest('li[data-q]');if(li){q.value=li.dataset.q;q.focus()}});
hdate.addEventListener('change',loadHist);
document.getElementById('hx').onclick=()=>{hdate.value='';loadHist()};
addEventListener('resize',fit);fit();setTimeout(()=>st.classList.add('ready'),150);
const ag=[...document.querySelectorAll('.agent')],q=document.getElementById('q'),b=document.getElementById('b');let mode=null,tm;
ag.forEach(a=>a.onclick=()=>{const on=a.getAttribute('aria-pressed')!=='true';ag.forEach(o=>o.setAttribute('aria-pressed',o===a&&on));mode=on?a.dataset.m:null;
 q.placeholder=mode==='sql'?'Ask about your database':mode==='etl'?'Describe the pipeline to run':'Please type your question';q.focus()});
function say(m,ms){b.textContent=m;b.classList.add('show');clearTimeout(tm);if(ms)tm=setTimeout(()=>b.classList.remove('show'),ms)}

function etlHtml(dis,fname){const d=dis?' disabled':'';return '<div class="eb"><i class="bl bl1"></i><i class="bl bl2"></i><i class="bl bl3"></i></div><div class="pt">Download options</div><div class="fn">'+esc(fname||'')+'</div><div class="dl"><button class="dlb" data-f="csv" style="--c1:#ff6b6b;--c2:#ffb347"'+d+'><span class="ic2"><svg class="di" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M9 4v16"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg></span><span class="tx"><span class="n">CSV</span><span class="s">Spreadsheet (.csv)</span></span><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg></span></button><button class="dlb" data-f="parquet" style="--c1:#22d3ee;--c2:#3b82f6"'+d+'><span class="ic2"><svg class="di" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20V14"/></svg></span><span class="tx"><span class="n">PARQUET</span><span class="s">Columnar (.parquet)</span></span><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg></span></button><button class="dlb" data-f="json" style="--c1:#a78bfa;--c2:#ec4899"'+d+'><span class="ic2"><svg class="di" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 2.5-2 3 1 .5 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5 1 2.5 2 3-1 .5-2 1.5-2 3v2c0 2-1 3-3 3"/></svg></span><span class="tx"><span class="n">JSON</span><span class="s">Structured (.json)</span></span><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg></span></button></div>'}
const panel=document.getElementById('panel'),ans=document.getElementById('ans');let last=null,busy=0,thinkT=0,CUR=null;const PHE=['Reading your request','Extracting the data','Cleaning and transforming','Loading the results','Writing your answer'];const PH=['Reading your question','Asking the database','Checking the query is safe','Crunching the numbers','Writing your answer'];
const API_BASE=window.LOGIX_API||'';
async function runAgent(v,m,hooks){
  if(/[?&]demo\b/.test(location.search))return demoAgent(v,m);
  const r=await fetch(API_BASE+'/api/ask/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:v,mode:m||'auto'})});
  if(!r.ok||!r.body)throw new Error('server error '+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',res=null;
  for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='step')hooks.step(ev.label);else if(ev.type==='route')hooks.route(ev.route);else if(ev.type==='result'||ev.type==='error')res=ev}}
  if(!res)throw new Error('no response from the agent');
  return res}
async function demoAgent(v,m){
  await new Promise(r=>setTimeout(r,1700));
  if(m==='etl')return{route:'etl',columns:['order_id','customer','amount','status'],rows:[[1001,'Asha Verma',2499,'paid'],[1002,'Rohan Mehta',899,'paid'],[1003,'Isha Jain',1520,'refunded'],[1004,'Kabir Singh',4300,'paid'],[1005,'Neha Patel',760,'pending']],answer:'All done! I extracted the file, cleaned **1,248 rows** and loaded them into the sales table. No errors found. Your output is ready to download.'};
  return{route:'sql',columns:['id','payment_method','transactions'],rows:[[1,'Credit Card',482],[2,'Debit Card',377],[3,'UPI',915],[4,'PayPal',121],[5,'Net Banking',204],[6,'Cash on Delivery',158]],sql:'SELECT id, payment_method, COUNT(*) AS transactions FROM payments GROUP BY 1,2;',answer:'Your database has **6 payment methods**. UPI is the most used, with 915 transactions. The safety check passed because this query only reads data.'}}
function type(el,h){const tmp=document.createElement('div');tmp.innerHTML=h;const ch=Array.from(tmp.textContent);let i=0;(function s(){i++;el.innerHTML=i>=ch.length?h:ch.slice(0,i).join('');if(i<ch.length)setTimeout(s,16)})()}
function setActive(m){ag.forEach(o=>o.setAttribute('aria-pressed',o.dataset.m===m))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function badge(ok){return ok?'<span class="badge"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Safe query</span>':'<span class="badge bad"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Blocked</span>'}
function render(d){
  let hd,txt;
  if(d.type==='error'){last=null;const rt=st.dataset.m||'sql';
    if(rt==='etl'){panel.className='abs panel etl';panel.innerHTML=etlHtml(true,'')}
    else{panel.className='abs panel sqlp';panel.innerHTML='<div class="gin"><div class="ph">Sql table<span class="badge bad">Error</span></div><div class="empty">No result to show.</div></div>'}
    hd='Something went wrong';txt=fmt(d.message||'Please try again.')}
  else if(d.route==='etl'){last=d;const f=(d.files||[])[0];panel.className='abs panel etl';panel.innerHTML=etlHtml(!f,f?f.name:'No output file was found');
    hd=f?'Pipeline finished':'Pipeline finished, no file found';txt=fmt(d.answer)}
  else{last=d;const cols=d.columns||[],rows=d.rows||[];
    const th=cols.map(c=>'<th>'+esc(String(c).replace(/_/g,' '))+'</th>').join('');
    const tr=rows.map((r,i)=>'<tr style="animation-delay:'+Math.min(i,20)*.06+'s">'+r.map(c=>'<td>'+(c===null?'&mdash;':esc(c))+'</td>').join('')+'</tr>').join('');
    const body=d.safe===false?'<div class="empty"><b>Blocked by the safety check.</b><br>'+esc(d.comments||'')+'</div>':(rows.length?'<div class="tw"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div>':'<div class="empty">'+(d.chat?'Ask a question about your data<br><span class="hint">for example: average fare by city</span>':'The query returned no rows.')+'</div>');
    panel.className='abs panel sqlp';
    panel.innerHTML='<div class="gin"><div class="ph">Sql table<span class="cnt">'+rows.length+' rows</span>'+badge(d.safe!==false)+'</div>'+body+'<div class="sqlline" title="'+esc(d.sql)+'">'+esc(d.sql)+'</div></div>';
    hd=d.safe===false?'Blocked by safety check':'Fresh from your database';txt=fmt(d.answer)}
  clearInterval(thinkT);{const cn=ans.querySelector('.cans');if(cn){cn.classList.remove('pop');void cn.offsetWidth;cn.classList.add('pop','burst');setTimeout(()=>cn.classList.remove('burst'),1800)}}
  document.getElementById('at').innerHTML='<span class="hd">'+hd+'</span><span id="tx"></span>';type(document.getElementById('tx'),txt)}
function setup(m){
  setActive(m);st.dataset.m=m;st.classList.add('res','think');b.classList.remove('show');fit();
  panel.className='abs panel '+(m==='sql'?'sqlp':'etl');
  panel.innerHTML=m==='sql'?'<div class="gin"><div class="ph">Sql table<span class="badge wait">Working...</span></div><div class="tw">'+'<div class="sk"></div>'.repeat(6)+'</div></div>':etlHtml(true,'');
  ans.className='abs ans sqlb';CUR=m==='etl'?PHE:PH;
  ans.innerHTML=CANS+'<div class="gl" id="at"><div class="tk"><span id="ph">'+CUR[0]+'</span></div></div>';
  clearInterval(thinkT);let pi=0;thinkT=setInterval(()=>{const e=document.getElementById('ph');if(e)e.textContent=CUR[++pi%CUR.length]},1100)}
async function run(){
  const v=q.value.trim();if(!v){say('Type a question first.',2200);q.focus();return}
  let m=mode||(/etl|clean|load|extract|transform|pipeline|csv|import/i.test(v)?'etl':'sql');
  const id=++busy;setup(m);
  const hooks={step:label=>{if(id!==busy)return;clearInterval(thinkT);const e=document.getElementById('ph');if(e)e.textContent=label},
    route:r=>{if(id!==busy||r===m)return;m=r;setup(r)}};
  let d;try{d=await runAgent(v,mode,hooks)}catch(e){d={type:'error',message:'Could not reach the agent. Is the backend running? ('+e.message+')'}}
  if(id!==busy)return;st.classList.remove('think');clearInterval(thinkT);render(d);setTimeout(loadHist,300)}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();run()});
ag.forEach(a=>a.addEventListener('click',()=>{if(st.classList.contains('res')&&q.value.trim())setTimeout(run,0)}));
function home(){busy++;clearInterval(thinkT);st.classList.remove('res','think');fit()}
document.getElementById('home').onclick=home;addEventListener('keydown',e=>{if(e.key==='Escape')home()});
panel.addEventListener('click',e=>{const bt=e.target.closest&&e.target.closest('[data-f]');if(!bt||bt.disabled)return;
  const file=last&&last.files&&last.files[0];if(!file){say('There is no output file to download yet.',2600);return}
  const a=document.createElement('a');a.href=API_BASE+'/api/files/'+file.id+'?fmt='+bt.dataset.f;a.download='';document.body.appendChild(a);a.click();a.remove();say('Download started.',2000)});

function fitM(){const st2=document.getElementById('stage'),e=document.querySelector('.mtxt'),c=document.querySelector('.mintbg'),g=document.querySelector('.guy');if(!e||!c||!g)return;
 const sc=st2.getBoundingClientRect().width/st2.offsetWidth||1,r=document.createRange();r.selectNodeContents(e);
 const meas=()=>{const b=r.getBoundingClientRect();return[b.width/sc,b.height/sc]};
 e.style.fontSize='19px';let[w,h]=meas();if(!w)return;
 if(w>292){e.style.fontSize=(19*292/w)+'px';[w,h]=meas()}
 const m=19,L=747,T=289,cw=w+2*m,ch=(94+h+7)/0.79;
 c.style.width=cw+'px';c.style.height=ch+'px';e.style.left=(L+m)+'px';e.style.top=(T+94)+'px';g.style.left=(L+cw/2-65)+'px'}
fitM();placeHist();placeDesc();loadHist();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitM();placeHist();placeDesc()});
